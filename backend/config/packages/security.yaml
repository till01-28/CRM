security:
    password_hashers:
        App\Entity\User: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # /api/users/createUser endpoint'iga POST orqali murojaat qilinganda - token so'ralmasin
        user_create:
            pattern: ^/api/users/createUser$
            methods:
                - post
            security: false
        # image yuklanganda ham suralmasin deb yozdik
        image_upload:
            pattern: ^/api/media_objects$
            methods:
                - post
            security: false

        login:
            pattern: ^/api/users/auth$
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/users/auth
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        main:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/users/auth$, roles: PUBLIC_ACCESS }
        - { path: ^/api/users/createUser$, roles: PUBLIC_ACCESS }
        - { path: ^/api/media_objects$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
